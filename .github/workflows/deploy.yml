name: Deploy to App Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: motojobs

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298713973792:role/motojobs-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          # NEXT_PUBLIC_* must be build args: Next inlines them into the client
          # bundle at build time, so setting them at runtime has no effect.
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=https://motojobs.in \
            --build-arg NEXT_PUBLIC_APP_NAME=Motojobs.in \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to App Runner
        run: |
          # The ARN is hardcoded rather than resolved via list-services: that
          # call cannot be scoped to a resource, so granting it would widen the
          # deploy role to every App Runner service in the account.
          SERVICE_ARN="arn:aws:apprunner:ap-south-1:298713973792:service/motojobs/a629e4857f074d7c904b26e1f7ca3a99"

          # update-service REPLACES SourceConfiguration wholesale — it does not
          # merge. Omitting the env block here wipes every variable and secret
          # off the running service, so the full set must be restated on every
          # deploy. Keep this in sync with DEPLOYMENT.md §4.4.
          cat > /tmp/source-config.json <<EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "$IMAGE",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "3000",
                "RuntimeEnvironmentVariables": {
                  "NODE_ENV": "production",
                  "AWS_REGION": "ap-south-1",
                  "S3_BUCKET": "motojobs-uploads",
                  "EMAIL_FROM_ADDRESS": "noreply@motojobs.in",
                  "EMAIL_FROM_NAME": "Motojobs.in",
                  "EMAIL_REPLY_TO": "support@motojobs.in",
                  "CONTACT_INBOX": "support@motojobs.in",
                  "NEXT_PUBLIC_APP_URL": "https://motojobs.in",
                  "NEXT_PUBLIC_APP_NAME": "Motojobs.in",
                  "BILLING_ENABLED": "false"
                },
                "RuntimeEnvironmentSecrets": {
                  "DATABASE_URL": "arn:aws:secretsmanager:ap-south-1:298713973792:secret:motojobs/DATABASE_URL-4m3TIZ",
                  "DIRECT_URL": "arn:aws:secretsmanager:ap-south-1:298713973792:secret:motojobs/DIRECT_URL-Rdh7K0",
                  "JWT_SECRET": "arn:aws:secretsmanager:ap-south-1:298713973792:secret:motojobs/JWT_SECRET-IwdUSV",
                  "NEXTAUTH_SECRET": "arn:aws:secretsmanager:ap-south-1:298713973792:secret:motojobs/NEXTAUTH_SECRET-RDON6D",
                  "RESEND_API_KEY": "arn:aws:secretsmanager:ap-south-1:298713973792:secret:motojobs/RESEND_API_KEY-x6vW0S"
                }
              }
            },
            "AuthenticationConfiguration": {
              "AccessRoleArn": "arn:aws:iam::298713973792:role/motojobs-apprunner-ecr-access"
            },
            "AutoDeploymentsEnabled": false
          }
          EOF

          aws apprunner update-service --region "$AWS_REGION" \
            --service-arn "$SERVICE_ARN" \
            --source-configuration file:///tmp/source-config.json

          # There is no `aws apprunner wait`, so poll DescribeService ourselves.
          # OPERATION_IN_PROGRESS means the rollout is still running.
          for _ in $(seq 1 60); do
            sleep 20
            STATUS=$(aws apprunner describe-service --region "$AWS_REGION" \
              --service-arn "$SERVICE_ARN" --query 'Service.Status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              RUNNING) echo "deployed"; exit 0 ;;
              OPERATION_IN_PROGRESS) ;;
              *) echo "::error::Deployment ended in state $STATUS"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for deployment"
          exit 1
