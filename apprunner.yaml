version: 1.0
runtime: docker

build:
  commands:
    build:
      # App Runner builds from the Dockerfile; NEXT_PUBLIC_* must be passed as
      # build args because Next inlines them into the client bundle.
      - docker build
        --build-arg NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
        --build-arg NEXT_PUBLIC_APP_NAME=$NEXT_PUBLIC_APP_NAME
        -t app .

run:
  network:
    port: 3000
  # Secrets are resolved from Secrets Manager / SSM by ARN — never inline them
  # here, this file is committed.
  env:
    - name: NODE_ENV
      value: production
